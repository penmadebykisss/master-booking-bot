# Настройки бота под конкретного мастера. Меняете этот файл — бот работает по-новому (нужен перезапуск).
business: "Студия маникюра «Лак»"
master: "Анна"
timezone: "Europe/Moscow"

address: "Воронеж, ул. Пример, 1, офис 5"
how_to_get: "Вход со двора, домофон 5. Парковка во дворе бесплатная."
phone: "+7 900 000-00-00"

services:
  - name: "Маникюр с покрытием"
    minutes: 120
    price: 2000
    description: "Снятие, аппаратный маникюр, покрытие гель-лаком"
  - name: "Маникюр без покрытия"
    minutes: 60
    price: 1000
  - name: "Наращивание"
    minutes: 180
    price: 3000
  - name: "Педикюр с покрытием"
    minutes: 120
    price: 2500

# Рабочие часы по дням; нет строки — выходной. breaks — перерывы.
schedule:
  mon: { hours: "10:00-20:00", breaks: ["14:00-15:00"] }
  tue: { hours: "10:00-20:00", breaks: ["14:00-15:00"] }
  wed: { hours: "10:00-20:00", breaks: ["14:00-15:00"] }
  thu: { hours: "10:00-20:00", breaks: ["14:00-15:00"] }
  fri: { hours: "10:00-20:00", breaks: ["14:00-15:00"] }
  sat: { hours: "11:00-17:00" }

days_off: []              # отдельные выходные: ["2026-11-04"]
slot_step_minutes: 30     # шаг сетки времени
days_ahead: 14            # на сколько дней вперёд можно записаться
min_lead_minutes: 60      # не раньше чем через час от текущего момента
cancel_before_hours: 3    # клиент сам может отменить не позже чем за 3 часа
reminders_hours: [24, 2]  # напоминания клиенту

faq: |
  Оплата наличными или переводом после процедуры.
  Гарантия на покрытие 7 дней: если скол — исправим бесплатно.
  Можно прийти со своим дизайном — пришлите фото, оценим.
  Опоздание больше 15 минут — процедуру придётся сократить или перенести.

# Демо-режим: показывает, что записи тестовые, и кнопку «Хочу такого бота».
demo: true
demo_contact: "@penmadebykisss"
